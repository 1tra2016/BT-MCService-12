server:
  port: 8080

spring:
  application:
    name: API-GATEWAY

  cloud:
    gateway:
      default-filters:
        - AddResponseHeader=X-System-Name, Api-Gateway-System
      routes:
        - id: customer-service-route
          uri: lb://CUSTOMER-SERVICE
          predicates:
            - Path=/api/v1/customers/**


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
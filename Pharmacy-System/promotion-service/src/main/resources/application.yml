server:
  port: 8083
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/demo_db
    username: postgres
    password: 12345
    driver-class-name: org.postgresql.Driver
  application:
    name: promotion-service
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost
    prefer-ip-address: false
    instance-id: localhost:${server.port}

logging:
  level:
    com:
      medical:
        service: TRACE
    org:
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql: TRACE
    root: INFO